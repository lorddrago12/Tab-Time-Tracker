<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blocked</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a0a;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .wrap {
      text-align: center;
      animation: up 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @keyframes up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .badge {
      display: inline-block;
      background: #e8405a; color: #fff;
      font-size: 10px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      padding: 4px 14px; border-radius: 3px;
      margin-bottom: 32px;
    }
    .icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: #e8405a;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg { width: 32px; height: 32px; }
    .domain {
      font-size: 20px; font-weight: 600;
      color: #fff; letter-spacing: 0.5px;
    }
    .divider {
      width: 32px; height: 2px;
      background: #222; margin: 20px auto; border-radius: 2px;
    }
    .msg {
      font-size: 12px; color: #e8405a;
      letter-spacing: 1px; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Blocked</div>
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </div>
    <div class="domain" id="domain"></div>
    <div class="divider"></div>
    <div class="msg">This website is blocked</div>
  </div>
  <script>
    const site = new URLSearchParams(location.search).get('site') || 'this site';
    document.getElementById('domain').textContent = site;
  </script>
</body>
</html>
